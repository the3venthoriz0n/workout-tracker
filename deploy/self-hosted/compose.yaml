# Self-hosted stack for any Linux Docker host that already runs a Cloudflare Tunnel (cloudflared)
# in its own container. cloudflared is NOT part of this stack: it reaches the app over an
# existing, external Docker network (TUNNEL_NETWORK) at http://workout-tracker-app:3000 (a unique
# alias: plain `app` could also be another stack's service on that shared network). The only published
# port is on 127.0.0.1 (for a cloudflared in host network mode, see the README).
# on the host. Setup: deploy/self-hosted/README.md.
name: workout-tracker-selfhosted

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]

services:
  app:
    <<: *hardening
    # Pin by digest (repo@sha256:...). deploy.sh / update.sh set it; never use a mutable tag.
    image: ${IMAGE_REF:?}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://${DOMAIN:?}
      # Email for set-up and password-reset links (Resend). Sign-in needs a verified email,
      # and the API refuses to start without these in production.
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      # The tunnel sets cf-connecting-ip and the app is reachable only through it (no published
      # ports), so this header is safe to trust for per-client rate limits.
      CLIENT_IP_HEADER: cf-connecting-ip
      # Comma separated emails allowed to create an account; an empty value means open sign-up.
      # Required to be present (no colon in the expansion) so a misspelled name in .env fails
      # loudly instead of silently opening sign-up.
      SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST?set SIGNUP_ALLOWLIST in .env (empty means open sign-up)}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    ports:
      # Loopback only (never the LAN): lets a cloudflared that runs with host networking reach the
      # app at http://127.0.0.1:${APP_HOST_PORT:-18080}. With cloudflared on the shared Docker
      # network you can ignore this and use the alias below.
      - 127.0.0.1:${APP_HOST_PORT:-18080}:3000
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      tunnel:
        # Point the tunnel's public hostname at http://workout-tracker-app:3000, not http://app:3000.
        aliases: [workout-tracker-app]

  db:
    <<: *hardening
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [default]

networks:
  # The network cloudflared is already attached to; its name is a site-specific value.
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:?}

volumes:
  pgdata:
