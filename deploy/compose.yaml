# Production stack on the Droplet, in /opt/workout-tracker.
# CI uploads this file and runs deploy.sh; .env there is created on first deploy and never leaves the server.
name: workout-tracker

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *hardening
    image: ${IMAGE_REF:?}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      # Email for set-up and password-reset links (Resend). The API refuses to start
      # without them in production; add both to .env by hand (deploy.sh does not generate them).
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      # Extra allowed origins, comma separated (none needed for the web app; mobile builds later).
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardening
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  caddy_data:
  caddy_config:
