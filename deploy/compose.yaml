# Production stack on the Droplet, in /opt/workout-tracker.
# CI uploads this file and runs deploy.sh; .env there is created on first deploy and never leaves the server.
name: workout-tracker

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    <<: *hardening
    image: ${IMAGE_REF:?}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?}
      # Email for set-up and password-reset links (Resend). The API refuses to start
      # without them in production; add both to .env by hand (deploy.sh does not generate them).
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      # Optional: "Continue with Google" (both or neither). See .env.example.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Optional: the AI that estimates nutrition (Nutrition tab). Any OpenAI-compatible service or
      # Anthropic; unset means the feature reports itself unavailable. See .env.example.
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # Extra allowed origins, comma separated (none needed for the web app; mobile builds later).
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *hardening
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  caddy_data:
  caddy_config:
