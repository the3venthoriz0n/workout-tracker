# Local development only. Production uses deploy/compose.yaml.
# Start with `just dev`; it creates .env with random secrets on first run.
name: workout-tracker

x-database-url: &database-url postgres://${POSTGRES_USER:?run just setup}:${POSTGRES_PASSWORD:?run just setup}@db:5432/${POSTGRES_DB:?run just setup}

services:
  db:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Throwaway database for the API tests (`just test` / `just check` start it).
  # Data lives in tmpfs and no port is published, so it is reachable only from the dev
  # container over the compose network. The fixed credentials guard nothing of value.
  db-test:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test -d test]
      interval: 2s
      timeout: 3s
      retries: 20

  # API (:3000) and Vite (:5173) with hot reload; source is bind-mounted.
  dev:
    build:
      context: .
      target: dev
    user: ${DEV_UID:-1000}:${DEV_GID:-1000}
    working_dir: /app
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    environment:
      HOME: /tmp
      # tsx watch does not set it; the API refuses to start without NODE_ENV.
      NODE_ENV: development
      DATABASE_URL: *database-url
      DATABASE_URL_TEST: postgres://test:test@db-test:5432/test
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?run just setup}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?run just setup}
      API_PROXY_TARGET: http://localhost:3000
      DEV_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-}
    ports:
      # Vite is reachable from the LAN so a phone can open it. Set DEV_BIND=127.0.0.1
      # for loopback only. The API and database stay on loopback; Vite proxies /api.
      - ${DEV_BIND:-0.0.0.0}:5173:5173
      - 127.0.0.1:3000:3000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Production image against the local DB: `just preview` (http://localhost:8080).
  preview:
    profiles: [preview]
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?run just setup}
      BETTER_AUTH_URL: http://localhost:8080
    ports:
      - 127.0.0.1:8080:3000
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
