name: Release

# Pushing a version tag (e.g. v1.2.0) tests, builds, publishes and deploys that commit.
on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is a plain vX.Y.Z release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must match vX.Y.Z (no pre-release suffixes)"; exit 1; }
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tagged commit is not an ancestor of origin/main"; exit 1; }

  ci:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: [verify-tag, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Secrets and variables live in this environment, which only v* tags may deploy to.
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
    env:
      # Secrets, not vars, so the server IP is masked in public workflow logs.
      HOST: ${{ secrets.DEPLOY_HOST }}
      DOMAIN: ${{ vars.DOMAIN }}
      IMAGE_REF: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Validate DOMAIN
        run: printf '%s\n' "$DOMAIN" | grep -Eq '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$' || { echo "DOMAIN variable is not a valid lowercase hostname"; exit 1; }
      - name: Upload deploy files
        run: scp -o StrictHostKeyChecking=yes deploy/compose.yaml deploy/Caddyfile deploy/deploy.sh "deploy@$HOST:/opt/workout-tracker/"
      - name: Deploy
        run: ssh -o StrictHostKeyChecking=yes "deploy@$HOST" "DOMAIN='$DOMAIN' sh /opt/workout-tracker/deploy.sh '$IMAGE_REF'"
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "https://$DOMAIN/healthz"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
