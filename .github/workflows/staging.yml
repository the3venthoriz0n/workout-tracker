name: Staging image

# Pushing a version tag (vX.Y.Z, on main) publishes ghcr.io/<repo>:staging and :sha-<commit>
# after CI passes. Merging to main does not publish: staging only moves on a release.
# There is no deploy step and no secret beyond GITHUB_TOKEN: the staging host pulls the image
# itself (deploy/self-hosted/update.sh). update.sh does not verify the build attestation yet
# (follow-up in docs/release-checklist.md).
on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags, so the About footer can show the latest release
      - name: Tag is a plain vX.Y.Z release on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must match vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tagged commit is not an ancestor of origin/main"; exit 1; }
      - id: release
        run: echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=staging
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          build-args: |
            APP_VERSION=staging
            APP_RELEASE=${{ steps.release.outputs.tag }}
            APP_COMMIT=${{ github.sha }}
            APP_REPO=${{ github.repository }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
